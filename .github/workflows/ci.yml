name: CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docker-build:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
