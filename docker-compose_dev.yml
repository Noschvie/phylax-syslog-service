# Phylax Syslog Service - Development
# Uses pre-built image from GitHub Container Registry

services:
  phylax-syslog:
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    image: ghcr.io/noschvie/phylax-syslog-service:development
    container_name: phylax-syslog
    # Environment variables
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - SYSLOG_PORT=514
      - SYSLOG_LOG_DIR=/var/log/syslog
      - SYSLOG_FILE_SIZE_LIMIT=52428800
      - SYSLOG_FLUSH_INTERVAL=5000
      - SYSLOG_MAX_PROCESSING_DELAY=10000
      - HEARTBEAT_ENABLED=false
      # Additional env vars from .env file
    # Port mapping
    ports:
      - "514:514/udp"      # Syslog UDP port
    # Volume mounts
    volumes:
      - ./volumes/logs:/var/log/syslog        # Log storage
      - ./.env:/app/.env:ro                     # Configuration (read-only)

    # Resource limits (reduced for development)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

    # Health check (Docker-level)
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection({port: 514}, ()=>process.exit(0)).on('error', ()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Signal handling
    stop_signal: SIGTERM
    stop_grace_period: 30s

# Network configuration
networks:
  default:
    driver: bridge
